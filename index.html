<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập 31</title>
</head>
<body>
    <h2>Tính tích các số chia hết cho 7</h2>
    <form onsubmit="handleSubmit(event)">
        <input type="number" id="soDau" placeholder="Số đầu" required>
        <input type="number" id="soCuoi" placeholder="Số cuối" required>
        <button type="submit">Tính</button>
    </form>

    <h3 id="ketQua" style="color: blue;"></h3>

    <script>
        function handleSubmit(event) {
            event.preventDefault();
            const soDau = parseInt(document.getElementById("soDau").value);
            const soCuoi = parseInt(document.getElementById("soCuoi").value);

            let min = Math.min(soDau, soCuoi);
            let max = Math.max(soDau, soCuoi);

            let tich = 1;
            let coSo = false;

            for (let i = min; i <= max; i++) {
                if (i !== 0 && i % 7 === 0) {
                    tich *= i;
                    coSo = true;
                }
            }

            if (coSo) {
                console.log("Tich: " + tich);
                document.getElementById("ketQua").innerText = "Tích các số chia hết cho 7 là: " + tich;
            } else {
                console.log("Không có số nào chia hết cho 7");
                document.getElementById("ketQua").innerText = "Không có số nào chia hết cho 7";
            }
        }
    </script>
</body>
</html>
